<style>
  :root{
    --bg: #14161a;
    --surface: #1e2126;
    --surface-2: #262a31;
    --surface-3: #30353d;
    --line: #34383f;
    --accent: #e8442c;
    --accent-dim: #7a2a1e;
    --accent-active: #c93a24;
    --accent-shadow-06: rgba(232,68,44,0.06);
    --accent-shadow-35: rgba(232,68,44,0.35);
    --text: #f2f0eb;
    --text-dim: #8b909a;
    --text-faint: #565a62;
    --radius: 14px;
  }
  body.light{
    --bg: #f2f0eb;
    --surface: #ffffff;
    --surface-2: #f5f3ee;
    --surface-3: #e8e5dd;
    --line: #ddd8cd;
    --accent: #e8442c;
    --accent-dim: #f2b7ac;
    --text: #17181b;
    --text-dim: #63666d;
    --text-faint: #9a9da3;
  }
  body{ transition: background-color .15s ease; }
  *{ box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html,body{
    margin:0; padding:0; height:100%;
    background: var(--bg);
    color: var(--text);
    font-family: 'JetBrains Mono', ui-monospace, monospace;
    overscroll-behavior-y: none;
  }
  h1,h2,h3, .display{
    font-family: 'Oswald', 'Arial Narrow', sans-serif;
    text-transform: uppercase;
    letter-spacing: 0.02em;
    font-weight: 600;
    margin: 0;
  }
  button{ font-family: inherit; }
  #app{
    max-width: 480px;
    margin: 0 auto;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    position: relative;
    background: var(--bg);
  }

  /* ---------- Top bar ---------- */
  .topbar{
    display:flex; align-items:center; justify-content:space-between;
    padding: calc(22px + env(safe-area-inset-top)) 20px 14px;
    position: sticky; top:0; z-index: 20;
    background: linear-gradient(180deg, var(--bg) 70%, transparent);
    gap: 10px;
  }
  .brand{
    font-size: 22px;
    display:flex; align-items:center; gap:10px;
    color: var(--text);
  }
  .brand .plate-mark{
    width:20px; height:20px;
    border-radius:50%;
    border: 3px solid var(--accent);
    position:relative;
    flex-shrink:0;
  }
  .brand .plate-mark::after{
    content:''; position:absolute; inset:5px;
    border-radius:50%; background: var(--bg);
  }
  .topbar-right{ display:flex; align-items:center; gap:8px; }
  .icon-btn{
    background:none; border:none; color: var(--text-dim);
    font-size:22px; cursor:pointer; padding:6px;
    display:flex; align-items:center; justify-content:center;
    line-height:1;
  }
  .icon-btn:active{ color: var(--text); }

  .unit-toggle{
    display:flex; align-items:center;
    background: var(--surface);
    border: 1px solid var(--line);
    border-radius: 999px;
    padding: 3px;
    gap: 2px;
    flex-shrink:0;
  }
  .unit-toggle button{
    border:none; background:none; cursor:pointer;
    font-size: 11px; font-weight:600; letter-spacing:0.04em;
    padding: 6px 12px; border-radius: 999px;
    color: var(--text-faint);
    font-family: 'JetBrains Mono', monospace;
  }
  .unit-toggle button.active{
    background: var(--accent); color: var(--bg);
  }

  /* ---------- Home / empty state ---------- */
  .empty-state{
    flex:1;
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    gap:22px;
    padding: 40px 30px;
    text-align:center;
  }
  .empty-state .hint-label{
    color: var(--text-faint);
    font-size: 11px;
    letter-spacing: 0.18em;
    text-transform: uppercase;
  }
  .plate-btn{
    width: 92px; height: 92px;
    border-radius: 50%;
    background: var(--surface);
    border: 3px solid var(--accent);
    color: var(--accent);
    font-size: 40px;
    display:flex; align-items:center; justify-content:center;
    cursor:pointer;
    position: relative;
    box-shadow: 0 0 0 6px var(--accent-shadow-06);
    transition: transform .15s ease, box-shadow .15s ease;
  }
  .plate-btn::before{
    content:'';
    position:absolute; inset: 12px;
    border-radius:50%;
    border: 1px solid var(--line);
  }
  .plate-btn:active{ transform: scale(0.94); }
  .empty-state h2{ font-size: 20px; color: var(--text); }
  .empty-state p{ color: var(--text-dim); font-size: 13px; max-width: 260px; line-height:1.5; margin:0; }

  /* ---------- Session list ---------- */
  .session-list{
    flex:1;
    padding: 4px 18px 110px;
    display:flex; flex-direction:column; gap:12px;
  }
  .list-heading{
    display:flex; justify-content:space-between; align-items:baseline;
    padding: 8px 2px 4px;
  }
  .list-heading .count{
    color: var(--text-faint); font-size: 12px;
  }
  .session-card{
    background: var(--surface);
    border: 1px solid var(--line);
    border-radius: var(--radius);
    padding: 16px 18px;
    cursor:pointer;
    display:flex; flex-direction:column; gap:8px;
    transition: border-color .15s ease;
  }
  .session-card:active{ border-color: var(--accent-dim); }
  .session-card .row-top{
    display:flex; justify-content:space-between; align-items:center;
  }
  .session-card .date{
    font-family:'Oswald', sans-serif; font-size:16px; font-weight:600;
    text-transform:uppercase; letter-spacing:0.03em;
  }
  .session-card .time{ color: var(--text-dim); font-size: 12px; }
  .session-card .exercises-preview{
    color: var(--text-dim); font-size: 12.5px;
    overflow:hidden; text-overflow:ellipsis; white-space:nowrap;
  }
  .session-card .stats{
    display:flex; gap:14px; margin-top:2px;
  }
  .session-card .stat{
    font-size: 11px; color: var(--text-faint);
    letter-spacing: 0.06em;
  }
  .session-card .stat b{ color: var(--accent); font-weight:600; }

  .fab{
    position: fixed;
    bottom: calc(26px + env(safe-area-inset-bottom)); left:50%;
    transform: translateX(-50%);
    max-width: 480px;
    width: calc(100% - 40px);
    display:flex; justify-content:flex-end;
    pointer-events:none;
    z-index: 30;
  }
  .fab button{
    pointer-events:all;
    width: 60px; height:60px; border-radius:50%;
    background: var(--accent);
    border:none;
    color: var(--bg);
    font-size: 30px;
    display:flex; align-items:center; justify-content:center;
    cursor:pointer;
    box-shadow: 0 8px 20px var(--accent-shadow-35);
  }
  .fab button:active{ transform: scale(0.93); }

  /* ---------- Session editor / detail ---------- */
  .editor{ flex:1; display:flex; flex-direction:column; padding-bottom: 110px; }
  .editor-header{
    padding: 4px 20px 18px;
  }
  .editor-header h1{ font-size: 24px; margin-bottom: 4px; }
  .meta-row{
    display:flex; gap:10px; padding: 0 20px 18px;

<div id="app"></div>

<script>

  // Claude's chat interface provides window.storage for persistence.
  // Outside that environment (e.g. this file opened directly on a phone),
  // window.storage won't exist — so we fall back to the browser's own
  // localStorage, which works completely offline with no account needed.
  // Everything else in the app is unchanged; it just calls window.storage
  // the same way either way.
  if(!window.storage){
    window.storage = {
      get: async (key)=>{
        try{
          const val = localStorage.getItem(key);
          if(val === null) return null;
          return { key, value: val, shared: false };
        }catch(e){ return null; }
      },
      set: async (key, value)=>{
        try{
          localStorage.setItem(key, value);
          return { key, value, shared: false };
        }catch(e){ return null; }
      },
      delete: async (key)=>{
        try{
          localStorage.removeItem(key);
          return { key, deleted: true, shared: false };
        }catch(e){ return null; }
      },
      list: async (prefix)=>{
        try{
          const keys = Object.keys(localStorage).filter(k=> !prefix || k.startsWith(prefix));
          return { keys, prefix, shared: false };
        }catch(e){ return null; }
      }
    };
  }

  // for the icon; iOS Safari uses the apple-touch-icon link in <head> instead).
  (function setupManifest(){
    try {

        name: "Iron Log",
        short_name: "Iron Log",

        display: "standalone",
        background_color: "#14161a",

(function(){
  const app = document.getElementById('app');
  let state = {
    view: 'loading', // loading | home | editor | detail
    sessions: [],
    draft: null,       // session being created/edited
    editingId: null,   // if set, draft is editing this existing session id
    detailId: null,
    openExerciseIdx: null,
    detailOpenIdx: null,
    unit: 'kg',
    theme: 'dark',
    accentMode: 'default',
    accentColor: '#e8442c',
    recentAccents: [],
    presets: [],
    presetDraft: null,
    presetEditingId: null
  };

  const STORAGE_KEY = 'sessions';
  const UNIT_KEY = 'unit-pref';
  const THEME_KEY = 'theme-pref';
  const ACCENT_KEY = 'accent-pref';
  const PRESETS_KEY = 'presets';
  const KG_PER_LB = 0.45359237;

  function uid(){ return Date.now().toString(36) + Math.random().toString(36).slice(2,7); }

  function kgToLb(kg){ return kg / KG_PER_LB; }
  function lbToKg(lb){ return lb * KG_PER_LB; }

  // canonical storage is always kg. Convert to the currently active display unit.
  function toDisplayWeight(kgVal){
    if(kgVal === '' || kgVal === null || kgVal === undefined || isNaN(kgVal)) return '';
    const v = state.unit === 'lb' ? kgToLb(Number(kgVal)) : Number(kgVal);
    const rounded = Math.round(v * 10) / 10;
    return rounded;
  }
  // parse a value the user typed (in the currently active unit) back into canonical kg.
  function fromDisplayWeight(displayVal){
    if(displayVal === '' || displayVal === null || displayVal === undefined) return '';
    const num = parseFloat(displayVal);
    if(isNaN(num)) return '';
    return state.unit === 'lb' ? lbToKg(num) : num;
  }

  async function loadSessions(){
    try{
      const res = await window.storage.get(STORAGE_KEY, false);
      state.sessions = res && res.value ? JSON.parse(res.value) : [];
    }catch(e){
      state.sessions = [];
    }
    // migrate any legacy sets stored as raw "weight" into canonical "weightKg"
    let migrated = false;
    state.sessions.forEach(s=>{
      (s.exercises||[]).forEach(ex=>{
        (ex.sets||[]).forEach(set=>{
          if(Object.prototype.hasOwnProperty.call(set, 'weight')){
            const num = parseFloat(set.weight);
            set.weightKg = isNaN(num) ? '' : num;
            delete set.weight;
            migrated = true;
          }
        });
      });
    });
    if(migrated) persistSessions();

    try{
      const u = await window.storage.get(UNIT_KEY, false);
      if(u && (u.value === 'kg' || u.value === 'lb')) state.unit = u.value;
    }catch(e){ /* default kg */ }

    try{
      const t = await window.storage.get(THEME_KEY, false);
      if(t && (t.value === 'dark' || t.value === 'light')) state.theme = t.value;
    }catch(e){ /* default dark */ }
    applyTheme();

    try{
      const a = await window.storage.get(ACCENT_KEY, false);
      if(a && a.value){
        const parsed = JSON.parse(a.value);
        if(parsed.mode === 'custom' || parsed.mode === 'default') state.accentMode = parsed.mode;
        if(typeof parsed.color === 'string') state.accentColor = parsed.color;
        if(Array.isArray(parsed.recents)) state.recentAccents = parsed.recents.slice(0,3);
      }
    }catch(e){ /* default accent */ }
    applyAccent();

    try{
      const p = await window.storage.get(PRESETS_KEY, false);
      state.presets = p && p.value ? JSON.parse(p.value) : [];
    }catch(e){
      state.presets = [];
    }

    state.view = 'home';
    render();
  }

  async function persistSessions(){
    try{
      await window.storage.set(STORAGE_KEY, JSON.stringify(state.sessions), false);
    }catch(e){

    }
  }

  async function persistUnit(){
    try{
      await window.storage.set(UNIT_KEY, state.unit, false);
    }catch(e){ /* non-critical */ }
  }

  function setUnit(u){
    if(state.unit === u) return;
    state.unit = u;
    persistUnit();

  function applyTheme(){
    document.body.classList.toggle('light', state.theme === 'light');

  async function persistTheme(){
    try{
      await window.storage.set(THEME_KEY, state.theme, false);

  function setTheme(t){
    if(state.theme === t) return;
    state.theme = t;
    applyTheme();
    persistTheme();
    render();

  function hexToRgb(hex){
    hex = (hex || '').replace('#','').trim();
    if(hex.length === 3) hex = hex.split('').map(c=> c+c).join('');
    const num = parseInt(hex, 16);
    if(isNaN(num)) return { r: 232, g: 68, b: 44 };
    return { r: (num >> 16) & 255, g: (num >> 8) & 255, b: num & 255 };
  }

  // Blends a hex color toward black by the given amount (0-1), used to derive
  // pressed/active shades of whatever accent color the person picks.
  function darkenHex(hex, amount){
    const { r, g, b } = hexToRgb(hex);
    const nr = Math.round(r * (1 - amount));
    const ng = Math.round(g * (1 - amount));
    const nb = Math.round(b * (1 - amount));
    return `rgb(${nr}, ${ng}, ${nb})`;
  }

  function applyAccent(){
    const style = document.body.style;
    if(state.accentMode === 'custom' && state.accentColor){
      const hex = state.accentColor;
      const { r, g, b } = hexToRgb(hex);
      style.setProperty('--accent', hex);
      style.setProperty('--accent-active', darkenHex(hex, 0.22));
      style.setProperty('--accent-dim', darkenHex(hex, 0.45));
      style.setProperty('--accent-shadow-06', `rgba(${r}, ${g}, ${b}, 0.06)`);
      style.setProperty('--accent-shadow-35', `rgba(${r}, ${g}, ${b}, 0.35)`);
    } else {
      ['--accent','--accent-active','--accent-dim','--accent-shadow-06','--accent-shadow-35'].forEach(p=> style.removeProperty(p));
    }
  }

  async function persistAccent(){
    try{
      await window.storage.set(ACCENT_KEY, JSON.stringify({
        mode: state.accentMode,
        color: state.accentColor,
        recents: state.recentAccents
      }), false);
    }catch(e){ /* non-critical */ }
  }

  async function persistPresets(){

      await window.storage.set(PRESETS_KEY, JSON.stringify(state.presets), false);

  function addRecentAccent(hex){
    state.recentAccents = state.recentAccents.filter(c=> c.toLowerCase() !== hex.toLowerCase());
    state.recentAccents.unshift(hex);
    state.recentAccents = state.recentAccents.slice(0, 3);
  }

  function setAccentMode(mode){
    if(state.accentMode === mode){
      // still allow re-render (e.g. tapping Custom again while already custom does nothing)
      return;
    }
    state.accentMode = mode;
    if(mode === 'custom' && !state.accentColor){
      state.accentColor = '#e8442c';
    }
    applyAccent();
    persistAccent();
    render();
  }

  function chooseCustomAccent(hex, commit){
    state.accentColor = hex;

  function showToast(msg){
    const t = document.createElement('div');
    t.className = 'toast';
    t.textContent = msg;
    document.body.appendChild(t);
    requestAnimationFrame(()=> t.classList.add('show'));
    setTimeout(()=>{
      t.classList.remove('show');
      setTimeout(()=> t.remove(), 250);
    }, 1800);
  }

  // Custom confirm dialog: browser confirm()/alert() are blocked in this
  // sandboxed environment, so we build our own Yes/No modal.
  function showConfirmModal(message, onYes, opts){
    opts = opts || {};
    const overlay = document.createElement('div');
    overlay.className = 'confirm-overlay';
    overlay.innerHTML = `
      <div class="confirm-box">
        <p class="confirm-message">${escapeHtml(message)}</p>
        <div class="confirm-actions">
          <button class="confirm-no">${opts.noLabel || 'No'}</button>
          <button class="confirm-yes">${opts.yesLabel || 'Yes'}</button>
        </div>
      </div>
    `;
    document.body.appendChild(overlay);
    requestAnimationFrame(()=> overlay.classList.add('show'));

    function close(){
      overlay.classList.remove('show');
      setTimeout(()=> overlay.remove(), 150);
    }
    overlay.querySelector('.confirm-no').onclick = ()=>{
      close();
      if(opts.onNo) opts.onNo();
    };
    overlay.querySelector('.confirm-yes').onclick = ()=>{
      close();
      onYes();
    };
    overlay.onclick = (e)=>{ if(e.target === overlay){ close(); if(opts.onNo) opts.onNo(); } };
  }

  function fmtDate(d){
    if(!d) return 'No date';
    const parts = d.split('-');
    if(parts.length !== 3) return d;
    const dt = new Date(parts[0], parts[1]-1, parts[2]);
    return dt.toLocaleDateString(undefined, { month:'short', day:'numeric', year:'numeric' }).toUpperCase();
  }
  function fmtTime(t){
    if(!t) return '';
    const [h,m] = t.split(':').map(Number);
    const ap = h >= 12 ? 'PM' : 'AM';
    const h12 = ((h+11)%12)+1;
    return `${h12}:${String(m).padStart(2,'0')} ${ap}`;
  }

  // Builds a de-duplicated, frequency+recency ranked list of exercise names
  // the person has logged before, used to power the autofill suggestions.
  function getExerciseHistory(){
    const map = new Map(); // lowercase name -> { name, count, lastUsed }
    state.sessions.forEach(s=>{
      const when = s.createdAt || 0;
      (s.exercises||[]).forEach(ex=>{
        if(!ex.name) return;
        const key = ex.name.trim().toLowerCase();
        if(!key) return;
        if(map.has(key)){
          const entry = map.get(key);
          entry.count += 1;
          if(when > entry.lastUsed) entry.lastUsed = when;
        } else {
          map.set(key, { name: ex.name.trim(), count: 1, lastUsed: when });
        }
      });
    });
    return Array.from(map.values()).sort((a,b)=>{
      if(b.count !== a.count) return b.count - a.count;
      return b.lastUsed - a.lastUsed;
    });
  }

  // Finds the heaviest set logged for this exercise the last time it appeared
  // in any saved session, so a newly-added exercise can start pre-filled with
  // what needs beating. Returns { weightKg, reps } or null if never logged.
  function getLastBestSet(name){
    const key = (name || '').trim().toLowerCase();
    if(!key) return null;
    let best = null; // { createdAt, weightKg, reps }
    state.sessions.forEach(s=>{
      (s.exercises||[]).forEach(ex=>{
        if(!ex.name || ex.name.trim().toLowerCase() !== key) return;
        let maxSet = null;
        (ex.sets||[]).forEach(set=>{
          const w = parseFloat(set.weightKg);
          if(isNaN(w)) return;
          const r = parseFloat(set.reps) || 0;
          if(!maxSet){
            maxSet = set;
          } else {
            const curW = parseFloat(maxSet.weightKg);
            const curR = parseFloat(maxSet.reps) || 0;
            if(w > curW || (w === curW && r > curR)){
              maxSet = set;
            }
          }
        });
        if(!maxSet) return;
        const when = s.createdAt || 0;
        if(!best || when > best.createdAt){
          best = { createdAt: when, weightKg: maxSet.weightKg, reps: maxSet.reps };
        }
      });
    });
    return best;
  }

  function todayStr(){
    const d = new Date();

  // --- Android/Chrome hardware & gesture back-button support ---
  // Since this is a single-page app, the browser has no real navigation
  // history by default, so the back button just exits the app. We push a
  // "trap" history entry whenever we're on a non-home screen so back
  // presses land on our own popstate handler instead of closing the app.
  let lastNavView = 'home';

  function armBackTrap(){
    try{ history.pushState({ appNav: true }, '', location.href); }catch(e){ /* ignore */ }
  }

  function syncHistoryForCurrentView(){
    if(state.view === lastNavView) return;
    if(state.view !== 'home') armBackTrap();
    lastNavView = state.view;
  }

  function handleSystemBack(){
    if(state.view === 'editor'){
      confirmDiscard();
    } else if(state.view === 'presetEditor'){
      confirmDiscardPreset();
    } else if(state.view === 'detail'){
      state.view = 'home';
      state.detailId = null;
      render();
    } else if(state.view === 'settings'){
      state.view = 'home';
      render();
    }
    // if state.view is already 'home', do nothing — let this back press
    // exit the app normally, same as any other native app.
  }

  window.addEventListener('popstate', handleSystemBack);

  /* ---------------- RENDER ---------------- */
  function render(){
    if(state.view === 'loading'){
      app.innerHTML = '';
      return;
    }
    if(state.view === 'home') renderHome();
    else if(state.view === 'editor') renderEditor();
    else if(state.view === 'detail') renderDetail();
    else if(state.view === 'settings') renderSettings();
    else if(state.view === 'presetEditor') renderPresetEditor();
    syncHistoryForCurrentView();
  }

      const name = (nameOverride !== undefined ? nameOverride : newExInput.value).trim();
      if(!name) return;
      p.exercises.push(name);
      newExInput.value = '';
      hideSuggestions();
      render();
    };
    document.getElementById('addPresetExBtn').onclick = ()=> addEx();
    newExInput.onkeydown = (e)=>{ if(e.key === 'Enter'){ e.preventDefault(); addEx(); } if(e.key === 'Escape'){ hideSuggestions(); } };

    function hideSuggestions(){ suggestList.innerHTML = ''; }
    function showSuggestions(){
      const query = newExInput.value.trim().toLowerCase();
      if(!query){ hideSuggestions(); return; }
      const matches = getExerciseHistory()
        .filter(item => item.name.toLowerCase().includes(query))
        .slice(0, 6);
      if(!matches.length){ hideSuggestions(); return; }
      suggestList.innerHTML = `<div class="suggest-list">${matches.map(m=>{
        const lower = m.name.toLowerCase();
        const start = lower.indexOf(query);
        let label = escapeHtml(m.name);
        if(start !== -1){
          const before = escapeHtml(m.name.slice(0, start));
          const mid = escapeHtml(m.name.slice(start, start + query.length));
          const after = escapeHtml(m.name.slice(start + query.length));
          label = `${before}<span class="match">${mid}</span>${after}`;
        }
        return `<div class="suggest-item" data-name="${escapeHtml(m.name)}">
          <span>${label}</span>
          <span class="times">${m.count}&times;</span>
        </div>`;
      }).join('')}</div>`;
      suggestList.querySelectorAll('.suggest-item').forEach(el=>{
        el.onclick = ()=>{
          newExInput.value = el.dataset.name;
          hideSuggestions();
          newExInput.focus();
        };
      });
    }
    newExInput.oninput = showSuggestions;
    newExInput.onfocus = showSuggestions;
    newExInput.onblur = ()=> setTimeout(hideSuggestions, 150);

    document.getElementById('savePresetBtn').onclick = ()=> savePreset();
  }

  function confirmDiscardPreset(){
    const p = state.presetDraft;
    const hasData = p.name.trim().length > 0 || p.exercises.length > 0;
    const proceed = ()=>{
      state.presetDraft = null;
      state.presetEditingId = null;
      state.view = 'settings';
      render();
    };
    if(hasData){
      showConfirmModal(
        state.presetEditingId ? 'Discard your changes?' : 'Discard this preset? Nothing will be saved.',
        proceed,
        { onNo: armBackTrap }
      );
    } else {
      proceed();
    }
  }

  function savePreset(){
    const p = state.presetDraft;
    if(!p.name.trim()){
      showToast('Give this preset a name');
      return;
    }
    if(!p.exercises.length){
      showToast('Add at least one exercise');
      return;
    }
    p.name = p.name.trim();
    if(state.presetEditingId){
      const idx = state.presets.findIndex(x=> x.id === state.presetEditingId);
      if(idx !== -1) state.presets[idx] = p;
      else state.presets.push(p);
    } else {
      state.presets.push(p);
    }
    persistPresets();
    state.presetDraft = null;
    state.presetEditingId = null;
    state.view = 'settings';
    render();
    showToast('✅ Preset saved!');
  }

  function applyPreset(preset){
    const d = state.draft;
    if(!d.name || !d.name.trim()) d.name = preset.name;
    preset.exercises.forEach(name=>{
      const lastBest = getLastBestSet(name);
      const initialSet = lastBest ? { weightKg: lastBest.weightKg, reps: lastBest.reps } : { weightKg: '', reps: '' };
      d.exercises.push({ id: uid(), name, sets: [initialSet], isPR: false });
    });
    state.openExerciseIdx = null;
    render();
    showToast(`Added ${preset.exercises.length} exercise${preset.exercises.length===1?'':'s'} from "${preset.name}"`);
  }

  function showPresetPickerModal(){
    const overlay = document.createElement('div');
    overlay.className = 'confirm-overlay';
    const listHTML = state.presets.length ? state.presets.map((p, i)=> `
      <div class="preset-pick-item" data-idx="${i}">
        <div>
          <div class="preset-row-name">${escapeHtml(p.name)}</div>
          <div class="preset-row-sub">${p.exercises.length} exercise${p.exercises.length===1?'':'s'}</div>
        </div>
        <span class="chevron-right">&#8250;</span>
      </div>
    `).join('') : `<div class="empty-ex-hint" style="padding:6px 2px 2px;">No presets saved yet. Add some from Settings.</div>`;
    overlay.innerHTML = `
      <div class="confirm-box" style="max-width:360px;">
        <p class="confirm-message" style="margin-bottom:14px;">Use a preset</p>
        <div class="preset-pick-list">${listHTML}</div>
        <div class="confirm-actions">
          <button class="confirm-no" id="presetPickCancel" style="flex:1">Cancel</button>
        </div>
      </div>
    `;
    document.body.appendChild(overlay);
    requestAnimationFrame(()=> overlay.classList.add('show'));
    function close(){
      overlay.classList.remove('show');
      setTimeout(()=> overlay.remove(), 150);
    }
    overlay.querySelector('#presetPickCancel').onclick = close;
    overlay.onclick = (e)=>{ if(e.target === overlay) close(); };
    overlay.querySelectorAll('.preset-pick-item').forEach(el=>{
      el.onclick = ()=>{
        const idx = Number(el.dataset.idx);
        applyPreset(state.presets[idx]);
        close();
      };
    });
  }

  function startNewSession(){
    state.draft = {
      id: uid(),
      date: todayStr(),
      time: '',
      name: '',
      notes: '',
      exercises: [],
      createdAt: Date.now()
    };
    state.editingId = null;
    state.openExerciseIdx = null;
    state.view = 'editor';
    render();
  }

  function startEditSession(id){
    const s = state.sessions.find(x=> x.id === id);
    if(!s) return;
    state.draft = JSON.parse(JSON.stringify(s));
    state.editingId = id;
    state.openExerciseIdx = null;
    state.view = 'editor';
    render();
  }

  function renderEditor(){
    const d = state.draft;
    const isEditing = !!state.editingId;
    const hasData = d.exercises.length > 0;
    let html = `
      <div class="topbar">
        <button class="icon-btn" id="backBtn">&#8592;</button>
        <div class="topbar-right">
          ${unitToggleHTML()}
          <button class="icon-btn" id="cancelBtn" style="font-size:13px;color:var(--text-faint)">Discard</button>
        </div>
      </div>
      <div class="editor">
        <div class="editor-header">
          <h1>${isEditing ? 'Edit Session' : 'New Session'}</h1>
        </div>
        <div class="meta-row" style="padding-bottom:12px;">
          <div class="field" style="flex:1">
            <label>Name (optional)</label>
            <input type="text" id="nameInput" value="${escapeHtml(d.name || '')}" placeholder="e.g. Cool session" autocomplete="off">
          </div>
        </div>
        <div class="meta-row-grid">
          <div class="field">
            <label>Date</label>
            <input type="date" id="dateInput" value="${d.date || ''}">
          </div>
          <div class="field">
            <label>Time (optional)</label>
            <input type="time" id="timeInput" value="${d.time || ''}">
          </div>
        </div>

        <div style="padding:0 20px;">
          <button class="use-preset-row" id="usePresetBtn">
            <span>Use a preset</span>
            <span class="chevron-right">&#8250;</span>
          </button>
        </div>

        <div class="section-label">
          <span>Exercises</span>
          <span>weight in ${state.unit}</span>
        </div>
        <div class="exercise-list">
          ${d.exercises.map((ex, i)=> exerciseCardHTML(ex, i)).join('')}
        </div>
        ${!hasData ? `<div class="empty-ex-hint">Add the first exercise below to get started.</div>` : ''}

        <div class="add-exercise-row">
          <div class="add-exercise-field">
            <input type="text" id="newExInput" placeholder="Exercise name, e.g. Preacher curls" autocomplete="off">
            <div id="suggestList"></div>
          </div>
          <button id="addExBtn">+</button>
        </div>

        <div class="section-label" style="margin-top:18px">
          <span>Session Notes</span>
          <span>optional</span>
        </div>
        <div style="padding:0 20px 20px;">
          <textarea id="notesInput" class="notes-textarea" placeholder="How did the session go? Energy, soreness, anything worth remembering...">${escapeHtml(d.notes||'')}</textarea>
        </div>
      </div>
      <div class="bottom-bar">
        <button class="save-btn" id="saveBtn" ${hasData ? '' : 'disabled'}>${isEditing ? 'Save changes' : 'Save session'}</button>
      </div>
    `;
    app.innerHTML = html;
    wireUnitToggle();

    document.getElementById('backBtn').onclick = ()=> confirmDiscard();
    document.getElementById('cancelBtn').onclick = ()=> confirmDiscard();
    document.getElementById('dateInput').onchange = (e)=> d.date = e.target.value;
    document.getElementById('nameInput').oninput = (e)=> d.name = e.target.value;
    document.getElementById('timeInput').onchange = (e)=> d.time = e.target.value;
    document.getElementById('notesInput').oninput = (e)=> d.notes = e.target.value;
    document.getElementById('usePresetBtn').onclick = ()=> showPresetPickerModal();

    const newExInput = document.getElementById('newExInput');
    const suggestList = document.getElementById('suggestList');
    const addEx = (nameOverride)=>{
      const name = (nameOverride !== undefined ? nameOverride : newExInput.value).trim();
      if(!name) return;
      const lastBest = getLastBestSet(name);
      const initialSet = lastBest ? { weightKg: lastBest.weightKg, reps: lastBest.reps } : { weightKg: '', reps: '' };
      d.exercises.push({ id: uid(), name, sets: [initialSet], isPR: false });
      state.openExerciseIdx = d.exercises.length - 1;
      newExInput.value = '';
      hideSuggestions();
      render();
      focusFirstSetInput();
    };
    document.getElementById('addExBtn').onclick = ()=> addEx();
    newExInput.onkeydown = (e)=>{ if(e.key === 'Enter'){ e.preventDefault(); addEx(); } if(e.key === 'Escape'){ hideSuggestions(); } };

    function hideSuggestions(){ suggestList.innerHTML = ''; }

    function showSuggestions(){
      const query = newExInput.value.trim().toLowerCase();
      if(!query){ hideSuggestions(); return; }
      const matches = getExerciseHistory()
        .filter(item => item.name.toLowerCase().includes(query))
        .slice(0, 6);
      if(!matches.length){ hideSuggestions(); return; }
      suggestList.innerHTML = `<div class="suggest-list">${matches.map(m=>{
        const lower = m.name.toLowerCase();
        const start = lower.indexOf(query);
        let label = escapeHtml(m.name);
        if(start !== -1){
          const before = escapeHtml(m.name.slice(0, start));
          const mid = escapeHtml(m.name.slice(start, start + query.length));
          const after = escapeHtml(m.name.slice(start + query.length));
          label = `${before}<span class="match">${mid}</span>${after}`;
        }
        return `<div class="suggest-item" data-name="${escapeHtml(m.name)}">
          <span>${label}</span>
          <span class="times">${m.count}&times;</span>
        </div>`;
      }).join('')}</div>`;
      suggestList.querySelectorAll('.suggest-item').forEach(el=>{
        el.onclick = ()=>{
          newExInput.value = el.dataset.name;
          hideSuggestions();
          newExInput.focus();
        };
      });
    }
    newExInput.oninput = showSuggestions;
    newExInput.onfocus = showSuggestions;
    newExInput.onblur = ()=> setTimeout(hideSuggestions, 150);

    wireExerciseCards();

    document.getElementById('saveBtn').onclick = saveSession;

    if(state.openExerciseIdx !== null){
      focusFirstSetInput();
    }
  }

  function focusFirstSetInput(){
    const openBody = document.querySelector('.exercise-card .exercise-body');
    if(!openBody) return;
    const input = openBody.querySelector('.set-field input');
    if(input) setTimeout(()=> input.focus(), 30);
  }

  function exerciseCardHTML(ex, idx){
    const isOpen = state.openExerciseIdx === idx;
    const setCountLabel = ex.sets.length ? `${ex.sets.length} set${ex.sets.length>1?'s':''}` : 'No sets yet';
    let body = '';
    if(isOpen){
      body = `
        ${ex.sets.map((set, si)=> `
          <div class="set-row">
            <span class="set-num">${String(si+1).padStart(2,'0')}</span>
            <div class="set-field">
              <span>${state.unit}</span>
              <input type="number" inputmode="decimal" data-ex="${idx}" data-set="${si}" data-key="weight" value="${toDisplayWeight(set.weightKg)}" placeholder="0">
            </div>
            <div class="set-field">
              <span>reps</span>
              <input type="number" inputmode="numeric" data-ex="${idx}" data-set="${si}" data-key="reps" value="${set.reps || ''}" placeholder="0">
            </div>
            <button class="remove-set-btn" data-ex="${idx}" data-set="${si}" title="Remove set">&times;</button>
          </div>
        `).join('')}
        <button class="add-set-btn" data-idx="${idx}">+ Add set</button>
        <button class="remove-ex" data-idx="${idx}">Remove exercise</button>
      `;
    }
    return `
      <div class="exercise-card ${ex.isPR ? 'pr' : ''}">
        <div class="exercise-head ${isOpen?'open':''}" data-idx="${idx}">
          <span class="name">${escapeHtml(ex.name)}</span>
          <span class="meta">
            <span class="set-count">${setCountLabel}</span>
            <button class="pr-toggle-btn ${ex.isPR?'active':''}" data-pr-idx="${idx}" title="Mark as a PR">PR</button>
            <span class="chevron">&#9660;</span>
          </span>
        </div>
        ${isOpen ? `<div class="exercise-body">${body}</div>` : ''}
      </div>
    `;
  }

  function wireExerciseCards(){
    const d = state.draft;
    document.querySelectorAll('.exercise-head').forEach(el=>{
      el.onclick = ()=>{
        const idx = Number(el.dataset.idx);
        state.openExerciseIdx = (state.openExerciseIdx === idx) ? null : idx;
        render();
      };
    });
    document.querySelectorAll('.remove-ex').forEach(el=>{
      el.onclick = (e)=>{
        e.stopPropagation();
        const idx = Number(el.dataset.idx);
        d.exercises.splice(idx,1);
        state.openExerciseIdx = null;
        render();
      };
    });
    document.querySelectorAll('.pr-toggle-btn').forEach(el=>{
      el.onclick = (e)=>{
        e.stopPropagation();
        const idx = Number(el.dataset.prIdx);
        d.exercises[idx].isPR = !d.exercises[idx].isPR;
        render();
      };
    });
    document.querySelectorAll('.add-set-btn').forEach(el=>{
      el.onclick = (e)=>{
        e.stopPropagation();
        const idx = Number(el.dataset.idx);
        const sets = d.exercises[idx].sets;
        const prevSet = sets[sets.length - 1];
        const newSet = prevSet ? { weightKg: prevSet.weightKg, reps: prevSet.reps } : { weightKg: '', reps: '' };
        d.exercises[idx].sets.push(newSet);
        render();
        const openBody = document.querySelector('.exercise-card .exercise-body');
        if(openBody){
          const rows = openBody.querySelectorAll('.set-row');
          const last = rows[rows.length - 1];
          if(last){
            const input = last.querySelector('.set-field input');
            if(input){
              setTimeout(()=>{
                input.focus();
                input.select();
              }, 30);
            }
          }
        }
      };
    });
    document.querySelectorAll('.remove-set-btn').forEach(el=>{
      el.onclick = (e)=>{
        e.stopPropagation();
        const exIdx = Number(el.dataset.ex);
        const setIdx = Number(el.dataset.set);
        d.exercises[exIdx].sets.splice(setIdx, 1);
        render();
      };
    });
    document.querySelectorAll('.set-field input').forEach(el=>{
      el.onclick = (e)=> e.stopPropagation();
      el.oninput = (e)=>{
        const exIdx = Number(el.dataset.ex);
        const setIdx = Number(el.dataset.set);
        const key = el.dataset.key;
        if(key === 'weight'){
          d.exercises[exIdx].sets[setIdx].weightKg = fromDisplayWeight(el.value);
        } else {
          d.exercises[exIdx].sets[setIdx][key] = el.value;
        }
      };
    });
  }

  function confirmDiscard(){
    const d = state.draft;
    const hasData = d.exercises.length > 0;
    const proceed = ()=>{
      const returnToDetail = state.editingId;
      state.draft = null;
      state.editingId = null;
      if(returnToDetail){
        state.detailId = returnToDetail;
        state.detailOpenIdx = null;
        state.view = 'detail';
      } else {
        state.view = 'home';
      }
      render();
    };
    if(hasData){
      showConfirmModal(
        state.editingId ? 'Discard your changes?' : 'Discard this session? Nothing will be saved.',
        proceed,
        { onNo: armBackTrap }
      );
    } else {
      proceed();
    }
  }

  function saveSession(){
    const d = state.draft;
    if(!d.exercises.length) return;
    // drop exercises with no confirmed sets
    d.exercises = d.exercises.filter(ex => ex.sets && ex.sets.length);
    if(!d.exercises.length){
      showToast('Add at least one set before saving');
      return;
    }
    if(state.editingId){
      const idx = state.sessions.findIndex(s=> s.id === state.editingId);
      if(idx !== -1){
        d.createdAt = state.sessions[idx].createdAt; // keep original ordering
        state.sessions[idx] = d;
      } else {
        state.sessions.push(d);
      }
      persistSessions();
      state.detailId = d.id;
      state.detailOpenIdx = null;
      state.draft = null;
      state.editingId = null;
      state.view = 'detail';
      render();
      showToast('✅ Changes saved!');
    } else {
      state.sessions.push(d);
      persistSessions();
      state.draft = null;
      state.view = 'home';
      render();
      showToast('✅ Session saved!');
    }
  }

  function renderDetail(){
    const s = state.sessions.find(x=> x.id === state.detailId);
    if(!s){ state.view = 'home'; return render(); }
    const totalSets = s.exercises.reduce((sum,e)=> sum + e.sets.length, 0);
    const prCount = s.exercises.filter(e=> e.isPR).length;
    let html = `
      <div class="topbar">
        <button class="icon-btn" id="backBtn">&#8592;</button>
        <div class="topbar-right">
          ${unitToggleHTML()}
          <button class="icon-btn" id="editBtn" title="Edit session">&#9998;</button>
        </div>
      </div>
      <div class="editor">
        <div class="editor-header">
          <h1>${s.name && s.name.trim() ? escapeHtml(s.name.trim()) : fmtDate(s.date)}</h1>
          <div style="display:flex;align-items:center;gap:10px;margin-top:6px;flex-wrap:wrap;">
            ${s.name && s.name.trim() ? `<span style="color:var(--text-dim);font-size:12px">${fmtDate(s.date)}</span>` : ''}
            ${s.time ? `<span style="color:var(--text-dim);font-size:12px">${fmtTime(s.time)}</span>` : ''}
            ${prCount ? `<span class="pr-session-badge">PR &times;${prCount}</span>` : ''}
          </div>
        </div>
        <div class="section-label">
          <span>Exercises</span>
          <span>${s.exercises.length} · ${totalSets} sets · ${state.unit}</span>
        </div>
        <div class="exercise-list">
          ${s.exercises.map((ex, idx) => `
            <div class="exercise-card ${ex.isPR ? 'pr' : ''}">
              <div class="exercise-head detail-head ${state.detailOpenIdx===idx?'open':''}" data-idx="${idx}">
                <span class="name">${escapeHtml(ex.name)}</span>
                <span class="meta">
                  ${ex.isPR ? `<span class="pr-badge">PR</span>` : ''}
                  <span class="set-count">${ex.sets.length} set${ex.sets.length===1?'':'s'}</span>
                  <span class="chevron">&#9660;</span>
                </span>
              </div>
              ${state.detailOpenIdx===idx ? `
                <div class="exercise-body">
                  ${ex.sets.map((set,si)=> `
                    <div class="detail-set-row">
                      <span class="set-num">${String(si+1).padStart(2,'0')}</span>
                      <span class="val"><b>${toDisplayWeight(set.weightKg) === '' ? '—' : toDisplayWeight(set.weightKg)}</b> ${state.unit}</span>
                      <span class="val"><b>${set.reps || '—'}</b> reps</span>
                    </div>
                  `).join('')}
                </div>
              ` : ''}
            </div>
          `).join('')}
        </div>
        ${s.notes && s.notes.trim() ? `
          <div class="section-label" style="margin-top:18px"><span>Session Notes</span></div>
          <div class="notes-display">${escapeHtml(s.notes).replace(/\n/g,'<br>')}</div>
        ` : ''}
        <button class="delete-session-btn" id="deleteBtn">Delete session</button>
      </div>
    `;
    app.innerHTML = html;
    wireUnitToggle();
    document.querySelectorAll('.detail-head').forEach(el=>{
      el.onclick = ()=>{
        const idx = Number(el.dataset.idx);
        state.detailOpenIdx = (state.detailOpenIdx === idx) ? null : idx;
        render();
      };
    });
    document.getElementById('backBtn').onclick = ()=>{
      state.view = 'home'; state.detailId = null; render();
    };
    document.getElementById('editBtn').onclick = ()=> startEditSession(s.id);
    document.getElementById('deleteBtn').onclick = ()=>{
      showConfirmModal('Are you sure you want to delete this session?', ()=>{
        state.sessions = state.sessions.filter(x=> x.id !== s.id);
        persistSessions();
        state.view = 'home'; state.detailId = null;
        render();
        showToast('🗑️ Session removed');
      });
    };
  }

  function escapeHtml(str){
    const d = document.createElement('div');
    d.textContent = str;
    return d.innerHTML;
  }

  loadSessions();
})();
</script>
</body>
</html>
